[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True

# Security by Design: Prevent static analyzers from scanning third-party dependencies
exclude = (?x)(
    ^\.venv/
    | ^venv/
    | ^env/
    | ^\.git/
    | ^__pycache__/
    | ^build/
    | ^dist/
  )

[mypy-tests.*]
disallow_untyped_defs = False

[mypy-locust.*]
ignore_missing_imports = True