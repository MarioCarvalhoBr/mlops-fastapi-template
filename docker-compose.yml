# docker-compose.yml
services:
  retail-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Define 'cpu' as the default group, but allow override via build args (e.g., for GPU builds)
        INSTALL_GROUP: ${INSTALL_GROUP:-cpu}
    container_name: retail_ai_engine
    ports:
      - "8000:8000"
    volumes:
      # Persistência de Dados e Cache (Já existentes)
      - ./data/catalog:/app/data/catalog
      - hf_model_cache:/app/cache/huggingface
      
      # --- HOT-RELOAD VOLUMES ---
      # Mapeia o código fonte local para o contentor
      - ./src:/app/src
      # Mapeia o frontend para o contentor
      - ./frontend:/app/frontend
      # ---------------------------

    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - HF_HUB_OFFLINE=0
      # O backend Xet do Hugging Face fica pendurado nesta rede (download para a 0 b/s
      # e nunca retoma). Forçamos o download HTTPS clássico pelo CDN.
      - HF_HUB_DISABLE_XET=1
    
    # Sobrescreve o CMD do Dockerfile para ativar o modo --reload
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    
    restart: unless-stopped

volumes:
  hf_model_cache:
    name: retail_ai_hf_cache