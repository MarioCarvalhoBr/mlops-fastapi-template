# .github/workflows/cd.yml
name: MLOps CD Pipeline (Auto Release & Docker Push)

on:
  push:
    # Dispara o workflow apenas quando uma tag de versão semântica é enviada
    tags:
      - 'v*.*.*'

# Permissões estritas necessárias para criar Releases e enviar pacotes (GHCR)
permissions:
  contents: write
  packages: write

jobs:
  # Job 1: Cria as notas de lançamento (Changelog) e a Release Oficial no GitHub
  automated-release:
    name: Generate GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse Release Notes from CHANGELOG
        id: extract_changelog
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Extracting notes for version: $VERSION"
          
          # AWK robusto para extrair o texto exato da versão no CHANGELOG.md
          awk -v ver="$VERSION" '/^## \[/ { if (index($0, "["ver"]")) {flag=1; next} else if (flag) exit } flag' CHANGELOG.md > release_notes.txt
          
          if [ ! -s release_notes.txt ]; then
            echo "No changelog entries found for $VERSION. Fallback to auto-generation." > release_notes.txt
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }} - Retail-AI
          body_path: release_notes.txt
          draft: false
          prerelease: false
          generate_release_notes: true

  # Job 2: Constrói a imagem Docker e envia para os Registries (Docker Hub e GHCR)
  docker-release:
    name: Build and Push Docker Image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: automated-release
    strategy:
      matrix:
        variant: [cpu, gpu] # Rodará duas vezes em paralelo
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/retail-ai
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}-${{ matrix.variant }}
            type=raw,value=latest-${{ matrix.variant }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            INSTALL_GROUP=${{ matrix.variant }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max