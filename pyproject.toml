[tool.poetry]
name = "retail-ai-mlops-fastapi-template"
version = "1.2.0"
description = "Retail-AI: Intelligence Engine for E-commerce using FastAPI and Hugging Face"
authors = ["Mário de Araújo Carvalho"]
readme = "README.md"
package-mode = false

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = "^0.100.1"
uvicorn = "^0.23.2"
pydantic = "^2.13.3"
pydantic-settings = "^2.14.0"
huggingface-hub = "^0.36.2"
transformers = "^4.57.6"
pillow = "^10.4.0"
timm = "^0.9.16"
python-multipart = "^0.0.9"
aiofiles = "^23.2.1"
python-dotenv = "^1.2.2"
pyyaml = "^6.0.3"

[tool.poetry.group.cpu.dependencies]
torch = {version = "^2.11.0", source = "pytorch-cpu"}
torchvision = {version = "^0.26.0", source = "pytorch-cpu"}

[tool.poetry.group.gpu.dependencies]
torch = "^2.11.0"
torchvision = "^0.26.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
httpx = "^0.24.1"
locust = "^2.15.1"
black = "^23.7.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
mypy = "^1.4.1"
types-pyyaml = "^6.0.12.20260408"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 150
target-version = ['py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.pytest.ini_options]
pythonpath = [
  "."
]