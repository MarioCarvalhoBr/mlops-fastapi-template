[tool.poetry]
name = "mlops-fastapi-template"
version = "0.2.0"
description = "Retail-AI: Motor de Inteligência para E-commerce com FastAPI e Hugging Face"
authors = ["Mário de Araújo Carvalho"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
fastapi = "^0.100.0"
uvicorn = "^0.23.0"
pydantic-settings = "^2.0.0"
pyyaml = "^6.0"
transformers = "^5.6.0"
torch = "^2.11.0"
pydantic = "^2.13.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
httpx = "^0.24.1"
locust = "^2.15.1"
black = "^23.7.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
mypy = "^1.4.1"
types-pyyaml = "^6.0.12.20260408"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.pytest.ini_options]
pythonpath = [
  "."
]