[tool.poetry]
name = "mlops-fastapi-template"
version = "0.6.0"
description = "Retail-AI: Intelligence Engine for E-commerce using FastAPI and Hugging Face"
authors = ["Mário de Araújo Carvalho"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.100.0"
uvicorn = "^0.23.0"
pydantic-settings = "^2.0.0"
pyyaml = "^6.0"
transformers = "^4.38.0"
torch = "^2.2.0"
# Explicitly added torchvision to prevent Poetry from fetching v0.12.0 
# which lacks Python 3.12 ABI support.
torchvision = ">=0.17.0" 
pillow = "^10.2.0"
python-multipart = "^0.0.9"
timm = "^0.9.16"
aiofiles = "^25.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
httpx = "^0.24.1"
locust = "^2.15.1"
black = "^23.7.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
mypy = "^1.4.1"
types-pyyaml = "^6.0.12.20260408"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 150
target-version = ['py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.pytest.ini_options]
pythonpath = [
  "."
]